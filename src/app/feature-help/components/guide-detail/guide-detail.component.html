@if (guide(); as guide) {
  <!-- Back-to-parent is a scope control by the TICKET-UI-24 rule, so it sits in `[actions-start]`
       (TICKET-PUB-09). A `routerLink`, not `history.back()`: a guide opened from a deep link or
       from a feature page's "Guide" button must still land on the list. -->
  <mm-page-header [title]="guide.title">
    <mm-button actions-start variant="ghost" size="sm" link="/help">
      <ng-icon name="tablerChevronLeft" size="16" aria-hidden="true" />
      Back to how-to's
    </mm-button>
  </mm-page-header>

  <mm-paper elevation="raised">
    <!-- The summary was the header's subtitle until TICKET-UI-22 dropped subtitles app-wide. It is
         the guide's own opening line rather than chrome, and `app-guide-steps` renders only the
         numbered steps — so it moves into the body here instead of being lost. -->
    <mm-text variant="caption" as="p" class="mb-4 block">{{ guide.summary }}</mm-text>
    <app-guide-steps [steps]="guide.steps" />

    <div class="mt-6">
      <mm-button color="primary" [link]="guide.tryItRoute">{{ guide.tryItLabel }}</mm-button>
    </div>
  </mm-paper>
} @else {
  <!-- A bad slug is not a dead end: the empty state carries the same route back the header does. -->
  <mm-empty-state title="Guide not found" message="This how-to guide doesn't exist.">
    <mm-button action color="primary" class="mt-2" link="/help">Back to how-to's</mm-button>
  </mm-empty-state>
}
