<!-- Back-to-parent is a scope control by the TICKET-UI-24 rule, so it sits in `[actions-start]`
     (TICKET-PUB-09). A `routerLink`, not `history.back()`: a deep-linked visitor must land on the
     list rather than wherever they came from. The copy names the section the sidebar and the index
     both use, not the route. -->
<mm-page-header title="FAQ">
  <mm-button actions-start variant="ghost" size="sm" link="/help">
    <ng-icon name="tablerChevronLeft" size="16" aria-hidden="true" />
    Back to how-to's
  </mm-button>
</mm-page-header>

<div class="flex flex-col gap-3">
  @for (entry of entries; track entry.question) {
    <mm-collapse>
      <mm-text mm-collapse-title as="span" weight="semibold">{{ entry.question }}</mm-text>
      <mm-text as="p" variant="caption" class="block pb-2">{{ entry.answer }}</mm-text>
    </mm-collapse>
  }
</div>
