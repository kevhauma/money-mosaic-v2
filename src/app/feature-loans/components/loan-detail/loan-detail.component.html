@if (loan(); as loan) {
  <!-- Back-to-parent is a scope control by the TICKET-UI-24 rule — it changes what you are looking
       at — so it sits beside the title; everything that acts on this loan stays right. -->
  <mm-page-header [title]="loan.name">
    <mm-button actions-start variant="ghost" size="sm" link="/loans">Back to loans</mm-button>
    <mm-flex actions-end align="center" gap="2">
      <mm-button size="sm" (click)="editFormOpen.set(true)">
        <ng-icon name="tablerPencil" size="14" aria-hidden="true" />
        Edit
      </mm-button>
      <mm-button size="sm" (click)="toggleArchive()">
        <ng-icon [name]="archiveToggle().icon" size="14" aria-hidden="true" />
        {{ archiveToggle().label }}
      </mm-button>
      <mm-button variant="outline" color="error" size="sm" (click)="deleteConfirmOpen.set(true)">
        <ng-icon name="tablerTrash" size="14" aria-hidden="true" />
        Delete
      </mm-button>
    </mm-flex>
  </mm-page-header>

  @if (scheduleStatus(); as status) {
    <mm-flex align="center" gap="2" class="mb-4 flex-wrap">
      <mm-badge [color]="status.color" size="sm">{{ status.label }}</mm-badge>
      <mm-text as="p" variant="caption" class="text-base-content/60">{{
        status.interestLabel
      }}</mm-text>
    </mm-flex>
  }

  <!-- The header, its actions, and the schedule badge stay above the bar: they describe the loan
       itself, not one view of it. Which tab is open is component state, not a route param — a tab
       here isn't worth deep-linking (TICKET-LOAN-13). -->
  <mm-tabs
    [tabs]="detailTabs"
    [selected]="activeTab()"
    (selectedChange)="selectTab($event)"
    variant="lift"
    class="mb-4 w-fit"
  />

  @if (activeTab() === 'what-if') {
    <app-loan-what-if [loan]="loan" [payments]="payments()" />
  } @else {
    <app-loan-balance-chart [loan]="loan" [payments]="payments()" class="mb-4 block" />

    <app-loan-amortization-table [loan]="loan" class="mb-4 block" />

    <app-loan-payments-list [loan]="loan" class="mb-4 block" />
  }

  <app-loan-form
    [(open)]="editFormOpen"
    [loan]="loan"
    [existingLoans]="loansStore.activeLoans()"
    (saved)="saveEdit($event)"
  />

  <mm-confirm-dialog
    [(open)]="deleteConfirmOpen"
    title="Delete this loan?"
    message="This removes the loan and its tracked progress. It does not delete the linked category or any transactions. This cannot be undone."
    confirmLabel="Delete loan"
    [danger]="true"
    (confirmed)="deleteConfirmed()"
  />
} @else {
  <mm-empty-state title="Loan not found" message="It may have been deleted or archived away.">
    <mm-button action color="primary" class="mt-2" link="/loans">Back to loans</mm-button>
  </mm-empty-state>
}
