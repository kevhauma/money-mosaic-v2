<div class="mt-3 border-t border-base-300 pt-3">
  <mm-button
    variant="ghost"
    size="xs"
    class="max-w-full justify-start px-1"
    [ariaExpanded]="group().open"
    [ariaLabel]="group().toggleAriaLabel"
    (click)="toggle()"
  >
    <span aria-hidden="true">{{ group().expandIcon }}</span>
    <mm-text variant="caption">{{ group().label }}</mm-text>
  </mm-button>

  @if (group().open) {
    <ul class="mt-2 flex flex-col gap-2">
      @for (row of rows(); track row.overrideId) {
        <li class="flex flex-wrap items-center justify-between gap-3">
          <mm-text variant="caption">
            {{ row.label }} —
            <mm-privacy-blur [blurred]="privacyMode()">{{ row.typicalAmount }}</mm-privacy-blur>
          </mm-text>
          <mm-button
            variant="ghost"
            size="xs"
            [ariaLabel]="row.restoreAriaLabel"
            (click)="restoreRequested.emit(row.overrideId)"
          >
            Restore
          </mm-button>
        </li>
      }
    </ul>
  }
</div>
