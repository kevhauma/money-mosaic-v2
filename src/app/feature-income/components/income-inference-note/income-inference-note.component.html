<div class="mt-3">
  <mm-flex align="center" gap="2" [wrap]="true">
    <mm-text variant="caption">{{ statement() }}</mm-text>
    <mm-button
      variant="link"
      size="xs"
      [ariaExpanded]="open()"
      [ariaLabel]="toggleAriaLabel()"
      (click)="toggle()"
    >
      {{ toggleLabel() }}
    </mm-button>
  </mm-flex>

  @if (open()) {
    <div class="mt-2">
      <ng-content />
    </div>
  }
</div>
