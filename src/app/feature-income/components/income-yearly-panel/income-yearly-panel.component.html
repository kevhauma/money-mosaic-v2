<mm-paper>
  <mm-flex align="center" justify="between" gap="2">
    <h2 class="card-title text-base">Income by year</h2>

    <!-- Inline rather than a shared/ui primitive: the only segmented span picker in the app so far
         (TICKET-INC-07). A second use is what should promote it, not a first. -->
    <div class="join" role="group" aria-label="Comparison span">
      @for (option of spanOptions(); track option.value) {
        <button
          type="button"
          class="btn btn-sm join-item"
          [class.btn-active]="option.selected"
          [attr.aria-pressed]="option.selected"
          (click)="selectSpan(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </mm-flex>

  <mm-stat-card
    class="mt-2 block"
    [label]="multiYearHeadline().label"
    [value]="multiYearHeadline().value"
    [subLabel]="multiYearHeadline().subLabel"
    [tooltip]="multiYearHeadline().tooltip"
    [color]="multiYearHeadline().color"
  />

  <div
    echarts
    [options]="chartOption()"
    class="h-72 w-full"
    role="img"
    [attr.aria-label]="chartAriaLabel()"
  ></div>

  <!-- Screen-reader-only companion table for the chart above — not a visible data table, so it
       skips mm-table's overflow/border/zebra chrome entirely (TICKET-UI-07). -->
  <table class="sr-only">
    <caption>
      Income per calendar year, underlying the chart above
    </caption>
    <thead>
      <tr>
        <th scope="col">Year</th>
        <th scope="col">Income</th>
        <th scope="col">Change vs. prior year</th>
      </tr>
    </thead>
    <tbody>
      @for (row of accessibleRows(); track row.year) {
        <tr>
          <th scope="row">{{ row.year }}</th>
          <td>{{ row.total }}</td>
          <td>{{ row.change }}</td>
        </tr>
      }
    </tbody>
  </table>
</mm-paper>
