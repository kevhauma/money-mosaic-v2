@if (callouts().length > 0) {
  <!-- Wrapped rather than margined per-alert so nothing at all — not even a stray gap — renders
       when there is no step-change to report. -->
  <div class="mt-6 space-y-2">
    @for (callout of callouts(); track callout.key) {
      <mm-alert [status]="callout.status" variant="soft">
        <span class="grow">{{ callout.message }}</span>
        <mm-button
          variant="ghost"
          size="sm"
          ariaLabel="Dismiss this notice"
          (click)="dismiss(callout.key)"
        >
          Dismiss
        </mm-button>
      </mm-alert>
    }
  </div>
}
