<h2 class="card-title text-base">Income growth</h2>

@if (hasComparableMonth()) {
  <!-- The month names stay sharp and only the figure blurs (TICKET-PRIV-02): which month the two
       deltas below compare is a label, not an amount. -->
  <mm-text variant="caption" as="p">
    {{ caption().text }}
    <mm-privacy-blur [blurred]="privacyMode()">{{ caption().amount }}</mm-privacy-blur>
  </mm-text>

  <!-- Each stat is its own free-standing card (not a joined .stats strip), matching the dashboard's
       stat row exactly; the alternating tilt hooks only render in themes that opt in (Memphis). -->
  <div class="flex flex-wrap gap-6 py-2">
    @for (card of cards(); track card.label) {
      <mm-stat-card
        [label]="card.label"
        [value]="card.value"
        [subLabel]="card.subLabel"
        [tooltip]="card.tooltip"
        [color]="card.color"
        [link]="card.link"
        [queryParams]="card.queryParams"
        [tilt]="$even ? 'a' : 'b'"
        [blurred]="privacyMode()"
      />
    }
  </div>
} @else {
  <mm-text variant="caption" as="p">
    No complete calendar month in your history yet — growth needs a whole month to compare.
  </mm-text>
}
