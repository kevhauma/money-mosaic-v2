@if (sessionStore.showDefaultPasswordNotice()) {
  <!-- `role="status"`, not `alert`: nothing just happened, and an assertive announcement on every
       page load would be its own kind of nuisance. -->
  <mm-alert status="warning" variant="soft" class="mb-4" role="status">
    <!-- One child, so daisyUI's grid `.alert` lays out a single track and the flex rules below are
         the ones that decide anything. Given two children it would size the first to `auto` — the
         icon track — and the sentence would be squeezed while the buttons took the free space,
         never wrapping under it however narrow the viewport got. -->
    <div class="flex flex-wrap items-center gap-3">
      <mm-text as="p" variant="caption" class="min-w-60 flex-1">
        This app still uses the password it shipped with — the same
        <code>admin</code> every copy of it shares. Anyone who can reach this machine on your
        network can sign in as you.
      </mm-text>
      <span class="flex shrink-0 gap-2">
        <mm-button link="/settings" color="warning" size="sm">Change it</mm-button>
        <mm-button variant="ghost" size="sm" (click)="sessionStore.dismissDefaultPasswordNotice()">
          Not now
        </mm-button>
      </span>
    </div>
  </mm-alert>
}
