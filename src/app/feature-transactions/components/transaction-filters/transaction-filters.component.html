<mm-paper elevation="flat" bodyClass="" class="mb-4">
  <!-- Four columns at `lg`, not six (TICKET-TXN-11): six gave every track ~115px, while the amount
       direction's three-segment join needs ~180px and the button pair ~176px — both overran their
       cell and painted on top of their neighbour. Four tracks are ~187px, and the DOM order below
       (Search before the amount group) is what lets the two rows fill exactly, with no hole. -->
  <form [formGroup]="filterForm" class="grid grid-cols-2 gap-3 p-4 sm:grid-cols-3 lg:grid-cols-4">
    <mm-fieldset legend="Account" class="min-w-0">
      <mm-select formControlName="accountId" size="sm" class="w-full">
        <option value="">All accounts</option>
        @for (account of accountsStore.accounts(); track account.id) {
          <option [value]="account.id">{{ account.name }}</option>
        }
      </mm-select>
    </mm-fieldset>

    <mm-fieldset legend="Date range" class="min-w-0">
      <mm-date-range-input
        [value]="dateRangeValue()"
        (valueChange)="onDateRangeChange($event)"
        size="sm"
        class="w-full"
      />
    </mm-fieldset>

    <mm-fieldset legend="Category" class="min-w-0">
      <mm-select formControlName="categoryId" size="sm" class="w-full">
        <option value="">All categories</option>
        <option value="uncategorised">Uncategorised</option>
        @for (option of categoryOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </mm-select>
    </mm-fieldset>

    <mm-fieldset legend="Search" class="col-span-2 min-w-0 sm:col-span-3 lg:col-span-1">
      <mm-input
        type="text"
        formControlName="text"
        size="sm"
        class="w-full"
        placeholder="Description or counterparty"
      />
    </mm-fieldset>

    <!-- One container for the three amount controls (TICKET-TXN-10), so no breakpoint's wrap can
         put Category between the direction and the bounds it applies to. -->
    <div
      class="col-span-2 grid min-w-0 grid-cols-2 gap-3 sm:col-span-3 sm:grid-cols-3 lg:col-span-3"
      data-testid="amount-group"
    >
      <mm-fieldset legend="Amount type" class="col-span-2 min-w-0 sm:col-span-1">
        <div class="join w-full" role="group" aria-label="Amount direction">
          @for (option of amountDirections; track option.value) {
            <button
              type="button"
              class="btn btn-sm join-item min-w-0 flex-1"
              [class.btn-primary]="amountDirection() === option.value"
              [class.btn-outline]="amountDirection() !== option.value"
              [attr.aria-pressed]="amountDirection() === option.value"
              (click)="setAmountDirection(option.value)"
            >
              {{ option.label }}
            </button>
          }
        </div>
      </mm-fieldset>

      <mm-fieldset legend="Min amount" class="min-w-0">
        <mm-input
          type="number"
          step="0.01"
          min="0"
          formControlName="amountMin"
          size="sm"
          class="w-full"
        />
      </mm-fieldset>

      <mm-fieldset legend="Max amount" class="min-w-0">
        <mm-input
          type="number"
          step="0.01"
          min="0"
          formControlName="amountMax"
          size="sm"
          class="w-full"
        />
      </mm-fieldset>
    </div>

    <!-- Side by side while the pair owns a whole row, stacked once it is one ~187px `lg` track
         (TICKET-TXN-11): "Make rule from filter" needs 139px on one line, so halving the track
         wrapped it onto a second line the button's height then clipped. -->
    <div
      class="col-span-2 grid min-w-0 grid-cols-2 content-center gap-2 sm:col-span-3 lg:col-span-1 lg:grid-cols-1"
      data-testid="filter-actions"
    >
      <!-- `tooltip-left`, not the default top-centre: this sits against the form's right edge, and
           a centred tip is wider than its trigger, so its pseudo-element pushed the form's
           scrollWidth 5px past its clientWidth — a scrollbar for something that never paints. -->
      <div class="tooltip tooltip-left min-w-0" [attr.data-tip]="makeRuleHint()">
        <mm-button
          variant="ghost"
          size="sm"
          class="w-full"
          [disabled]="!canMakeRuleFromFilter()"
          (click)="onMakeRuleFromFilter()"
        >
          Make rule from filter
        </mm-button>
      </div>
      <mm-button
        variant="ghost"
        size="sm"
        class="w-full"
        [disabled]="!hasActiveFilters()"
        (click)="clearFilters()"
      >
        <ng-icon name="tablerFilterOff" size="16" aria-hidden="true" />
        Clear
      </mm-button>
    </div>
  </form>
</mm-paper>
