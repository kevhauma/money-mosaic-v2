<input
  [type]="type()"
  [class]="classes()"
  [placeholder]="placeholder()"
  [attr.step]="step()"
  [attr.min]="min()"
  [attr.max]="max()"
  [attr.maxlength]="maxlength()"
  [attr.aria-invalid]="ariaInvalid() || null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="ariaDescribedBy()"
  [disabled]="isDisabled()"
  [value]="displayValue()"
  (input)="handleInput($any($event.target).value)"
  (blur)="handleBlur()"
/>
