<mm-flex align="center" gap="2">
  <mm-button
    variant="ghost"
    size="sm"
    shape="square"
    ariaLabel="Previous period"
    [disabled]="navigationDisabled()"
    (click)="onPrevious()"
  >
    <ng-icon name="tablerChevronLeft" size="16" aria-hidden="true" />
  </mm-button>

  <div class="relative inline-block">
    <mm-button
      #triggerButton
      variant="outline"
      size="sm"
      [ariaExpanded]="isOpen()"
      (click)="toggle()"
    >
      <ng-icon name="tablerClock" size="16" aria-hidden="true" />
      {{ triggerLabel() }}
    </mm-button>

    @if (isOpen()) {
      <mm-paper
        elevation="floating"
        bodyClass="p-0"
        class="absolute top-full left-0 z-20 mt-1 w-max max-w-[min(42rem,calc(100vw-2rem))] overflow-hidden"
      >
        <div data-testid="range-picker-panels" class="flex max-h-[28rem] flex-col md:flex-row">
          <div
            class="flex flex-col gap-2 overflow-y-auto p-3 md:w-72 md:border-r md:border-base-300"
          >
            <mm-text variant="label">Absolute time range</mm-text>
            <mm-absolute-range-panel
              [fromExpr]="value().fromExpr"
              [toExpr]="value().toExpr"
              [unappliedEditsFlagged]="unappliedEditsWarningActive()"
              (apply)="onAbsoluteApply($event)"
            />
          </div>

          <div class="flex min-w-64 flex-col overflow-hidden p-3 md:w-72">
            <mm-text variant="label">Quick ranges</mm-text>

            <div class="relative mt-2">
              <ng-icon
                name="tablerSearch"
                size="14"
                aria-hidden="true"
                class="pointer-events-none absolute top-1/2 left-2 -translate-y-1/2 text-base-content/50"
              />
              <input
                #searchInput
                type="text"
                [value]="searchTerm()"
                (input)="onSearchInput($event)"
                placeholder="Search quick ranges"
                aria-label="Search quick ranges"
                class="input input-sm w-full pl-7"
              />
            </div>

            <div #quickRangeList data-testid="quick-range-list" class="mt-2 flex-1 overflow-y-auto">
              @if (filteredGroups().length === 0) {
                <mm-text as="p" variant="caption" class="mt-4 block text-center">
                  No ranges match "{{ searchTerm() }}"
                </mm-text>
              } @else {
                @for (group of filteredGroups(); track group.group) {
                  <mm-text variant="caption" class="mt-3 block uppercase first:mt-0">
                    {{ group.label }}
                  </mm-text>
                  @for (entry of group.entries; track entry.id) {
                    <button
                      type="button"
                      [attr.data-quick-range-id]="entry.id"
                      [attr.aria-current]="entry.id === value().preset ? 'true' : null"
                      class="btn btn-ghost btn-sm w-full justify-start font-normal aria-[current=true]:btn-active"
                      (click)="selectQuickRange(entry.id)"
                      (keydown)="onQuickRangeListKeydown($event)"
                    >
                      {{ entry.label }}
                    </button>
                  }
                }
              }
            </div>
          </div>
        </div>
      </mm-paper>
    }
  </div>

  <mm-button
    variant="ghost"
    size="sm"
    shape="square"
    ariaLabel="Next period"
    [disabled]="navigationDisabled()"
    (click)="onNext()"
  >
    <ng-icon name="tablerChevronRight" size="16" aria-hidden="true" />
  </mm-button>
</mm-flex>
