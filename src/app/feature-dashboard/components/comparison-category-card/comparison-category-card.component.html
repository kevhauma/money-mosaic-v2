<mm-paper
  elevation="floating"
  background=""
  bodyClass="p-3"
  [class]="tiltDirection() === 'l' ? 'mm-tilt-l' : 'mm-tilt-r'"
  [style]="'border-inline-start: 4px solid ' + category().color"
>
  <mm-flex align="center" justify="between" gap="2" class="mb-2">
    <mm-text weight="medium" class="min-w-0 truncate text-sm">{{ category().name }}</mm-text>
    @if (category().deltaLabel; as label) {
      <mm-text
        weight="bold"
        class="flex items-center gap-1 text-base"
        [color]="category().deltaColor"
      >
        <ng-icon [name]="category().deltaIcon" size="10" aria-hidden="true" />
        {{ label }}
      </mm-text>
    }
  </mm-flex>

  <div class="h-16">
    <mm-flex align="end" gap="1" class="relative h-full">
      @for (bar of category().bars; track bar.key) {
        <a
          [routerLink]="['/transactions']"
          [queryParams]="bar.queryParams"
          class="tooltip group flex h-full flex-1 flex-col items-end justify-end"
          [attr.data-tip]="bar.tooltipLabel"
        >
          <div
            class="w-full min-h-[2px] rounded-t transition group-hover:opacity-80"
            [class]="bar.isSelected ? 'bg-primary' : 'bg-base-content/15'"
            [style.height.%]="bar.heightPercent"
          ></div>
        </a>
      }
    </mm-flex>
  </div>

  <mm-text as="p" class="mt-2 flex justify-between text-xs text-base-content/60">
    <span>Avg {{ category().formattedAverage }}</span>
    <span>High {{ category().formattedHighest }}</span>
    <span>Low {{ category().formattedLowest }}</span>
  </mm-text>
</mm-paper>
