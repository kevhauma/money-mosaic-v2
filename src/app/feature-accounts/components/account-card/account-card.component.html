<mm-paper
  elevation="flat"
  bodyClass="card-body gap-3"
  [style]="'border-inline-start: 4px solid ' + vm().account.color"
>
  <mm-flex align="start" justify="between">
    <mm-flex align="center" gap="2">
      <ng-icon [name]="vm().iconName" size="20" aria-hidden="true" />
      <a [routerLink]="[vm().account.id]" class="card-title text-base hover:underline">
        {{ vm().account.name }}
      </a>
    </mm-flex>
    <mm-flex align="center" gap="1">
      <mm-button
        variant="ghost"
        shape="square"
        size="sm"
        [disabled]="vm().isFirst"
        (click)="moveUp.emit()"
        ariaLabel="Move account up"
      >
        <ng-icon name="tablerChevronUp" size="14" aria-hidden="true" />
      </mm-button>
      <mm-button
        variant="ghost"
        shape="square"
        size="sm"
        [disabled]="vm().isLast"
        (click)="moveDown.emit()"
        ariaLabel="Move account down"
      >
        <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
      </mm-button>
      <mm-dropdown align="end" contentClass="z-10 w-44">
        <mm-button trigger variant="ghost" shape="square" size="sm" ariaLabel="Account actions">
          <ng-icon name="tablerDotsVertical" size="16" aria-hidden="true" />
        </mm-button>
        <li>
          <button type="button" (click)="edit.emit()">
            <ng-icon name="tablerPencil" size="14" aria-hidden="true" />
            Edit
          </button>
        </li>
        <li>
          <button type="button" (click)="archive.emit()">
            <ng-icon
              [name]="vm().account.archived ? 'tablerArchiveOff' : 'tablerArchive'"
              size="14"
              aria-hidden="true"
            />
            {{ vm().account.archived ? 'Unarchive' : 'Archive' }}
          </button>
        </li>
        <li>
          <button type="button" class="text-error" (click)="delete.emit()">
            <ng-icon name="tablerTrash" size="14" aria-hidden="true" />
            Delete
          </button>
        </li>
      </mm-dropdown>
    </mm-flex>
  </mm-flex>

  <mm-badge variant="outline" size="sm" class="w-fit capitalize">{{ vm().account.type }}</mm-badge>

  @if (dataReady()) {
    <mm-text as="p" variant="display" [color]="vm().balance < 0 ? 'error' : undefined">
      {{ vm().balance | signedAmount }}
    </mm-text>
    @if (vm().hasShare) {
      <mm-text as="p" class="text-xs text-base-content/60">
        Your share: {{ vm().shareDisplay | signedAmount }}
      </mm-text>
    }
  } @else {
    <span class="skeleton inline-block h-8 w-24"></span>
  }

  @if (vm().ibanTail; as ibanTail) {
    <mm-text as="p" class="text-xs text-base-content/60">···· {{ ibanTail }}</mm-text>
  }
</mm-paper>
