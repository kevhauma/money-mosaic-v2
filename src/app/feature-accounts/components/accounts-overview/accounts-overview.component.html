<!-- Header sections (TICKET-UI-24): the range scopes what the page shows, so it sits beside the
     title; the toggle and "Add account" act on what is shown, so they stay right. -->
<mm-page-header title="Accounts">
  <mm-range-picker
    actions-start
    [value]="range.value()"
    (presetChange)="range.onPresetChange($event)"
    (customRangeChange)="range.onCustomRangeChange($event)"
    (rangeShift)="range.onRangeShift($event)"
  />
  <mm-flex actions-end align="center" gap="3">
    <mm-label as="label" class="gap-2">
      <mm-text variant="caption" color="base-content">Show archived</mm-text>
      <input
        type="checkbox"
        class="toggle toggle-sm"
        [checked]="showArchived()"
        (change)="showArchived.set(!showArchived())"
      />
    </mm-label>
    <mm-button color="primary" size="sm" (click)="openAddForm()">
      <ng-icon name="tablerPlus" size="16" aria-hidden="true" />
      Add account
    </mm-button>
  </mm-flex>
</mm-page-header>

<div class="mb-6">
  <app-account-balance-history-chart />
</div>

@if (!accountsStore.hydrated()) {
  <mm-loading-skeleton [rows]="3" />
} @else if (visibleAccounts().length === 0) {
  <mm-empty-state
    title="No accounts yet"
    message="Add your first account to start tracking transactions."
  >
    <ng-icon icon name="accountWallet" size="40" aria-hidden="true" />
    <mm-button action color="primary" class="mt-2" (click)="openAddForm()"> Add account </mm-button>
  </mm-empty-state>
} @else {
  <!-- One column at every breakpoint (TICKET-ACC-09): the cards read in the chart's own series
       order (literally a stack only in its combined view, since TICKET-ACC-12), and a grid can only
       match a linear order by reading order, which nobody does across three columns. -->
  <div class="grid grid-cols-1 gap-4">
    @for (card of accountCards(); track card.account.id) {
      <app-account-card
        [vm]="card"
        [dataReady]="accountsStore.dataReady()"
        (edit)="openEditForm(card.account)"
        (archive)="toggleArchive(card.account)"
        (delete)="confirmDelete(card.account)"
        (moveUp)="moveAccount(card.account, 'up')"
        (moveDown)="moveAccount(card.account, 'down')"
      />
    }
  </div>
}

<app-account-form [(open)]="formOpen" [account]="editingAccount()" (saved)="saveAccount($event)" />

<mm-confirm-dialog
  [(open)]="deleteConfirm.open"
  title="Delete this account?"
  [message]="deleteMessage()"
  confirmLabel="Delete account"
  [danger]="true"
  (confirmed)="deleteConfirmed()"
/>
