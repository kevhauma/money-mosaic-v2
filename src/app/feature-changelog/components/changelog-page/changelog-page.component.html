<!-- Header shape (TICKET-CHG-02): the switch decides which of the two views you are looking at, so
     it sits in `[actions-start]` beside the title — the same shape /categories and /rules have. The
     binding is the one difference: this is one route, so the switch is selection-driven
     (`[selected]` in, `(selectedChange)` out) rather than a pair of routerLinks. -->
<mm-page-header title="Changelog">
  <mm-tabs
    actions-start
    [tabs]="tabs"
    [selected]="selectedTab()"
    (selectedChange)="onTabChange($event)"
    class="w-fit"
  />
</mm-page-header>

@if (activeGroups().length === 0) {
  <mm-text as="p" variant="caption">{{ emptyMessage() }}</mm-text>
} @else {
  <div class="flex flex-col gap-4">
    @for (group of activeGroups(); track group.heading; let isLast = $last) {
      <div>
        <mm-text as="h2" variant="subheading" class="block">{{ group.heading }}</mm-text>
        <div class="mt-2 flex flex-col gap-3">
          @for (entry of group.entries; track entry.key) {
            <app-changelog-entry-row
              [area]="entry.area"
              [title]="entry.title"
              [details]="entry.details"
            />
          }
        </div>
      </div>
      <mm-divider [class.hidden]="isLast" />
    }
  </div>
}
