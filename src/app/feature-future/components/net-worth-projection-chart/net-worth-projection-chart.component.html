<mm-paper>
  <mm-text as="h2" variant="subheading" weight="semibold" class="mb-1">
    Projected net worth
  </mm-text>

  @if (!hasChart()) {
    <mm-empty-state title="Nothing to project yet" [message]="emptyMessage()">
      <ng-icon icon name="tablerChartLine" size="40" aria-hidden="true" />
    </mm-empty-state>
  } @else {
    <mm-text as="p" variant="caption" class="mb-2">{{ caption() }}</mm-text>
    @if (decliningWarning()) {
      <mm-text as="p" variant="caption" color="warning" class="mb-2">
        {{ decliningWarning() }}
      </mm-text>
    }

    <div
      echarts
      [options]="chartOption()"
      class="h-80 w-full"
      role="img"
      [attr.aria-label]="chartAriaLabel()"
    ></div>

    <app-projection-figure-table
      [rows]="accessibleRows()"
      [showComparison]="isRequiredRateMode()"
    />
  }
</mm-paper>
